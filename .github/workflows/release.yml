# Release: build, test-install and publish the Windows installer.
#
# Trigger: push a tag vX.Y.Z (must match emergence_kit/__init__.py), or run manually
# from the Actions tab to get a test build without publishing.
# ITIL: release and deployment management - one repeatable path from a tagged,
# tested commit to a checksummed MSI, with the build log kept as the record.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/emergence-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tag matches the code version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $code = (python -c "import emergence_kit; print(emergence_kit.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) { throw "tag v$tag does not match code version $code" }

      - name: Build
        run: ./packaging/build_windows.ps1

      # Code signing (roadmap phase 2/7). Enable once an Azure Trusted Signing account
      # exists; see docs/deploy/SIGNING.md. Unsigned MSIs work, but SmartScreen warns and
      # many enterprise policies block them.
      # - name: Sign
      #   uses: azure/trusted-signing-action@v0
      #   with: ...

      - name: Test install, run, uninstall
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed: $($p.ExitCode)" }
          $dir = "C:\Program Files\Ecomsp\EmergenceKit"
          Write-Host "Installed files (first 15):"
          Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 15 FullName | Format-Table -HideTableHeaders
          if (-not (Test-Path "$dir\emergence-kit.exe")) { throw "emergence-kit.exe not installed - see listing above" }
          & "$dir\emergence-kit.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed app did not run" }
          $v = (Get-ItemProperty "HKLM:\Software\Ecomsp\EmergenceKit").Version
          Write-Host "registry detection value: $v"
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path "C:\Program Files\Ecomsp\EmergenceKit\emergence-kit.exe") { throw "uninstall left files" }

      - uses: actions/upload-artifact@v7
        with:
          name: EmergenceKit-msi
          path: |
            tools/emergence-kit/dist/*.msi
            tools/emergence-kit/dist/*.sha256
            tools/emergence-kit/dist/*.cdx.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/emergence-kit/dist/*.msi
            tools/emergence-kit/dist/*.sha256
            tools/emergence-kit/dist/*.cdx.json
          body_path: CHANGELOG.md
