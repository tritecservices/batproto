# Continuous integration: every push and pull request is tested the same way.
# ITIL: change enablement and release management start here - no change reaches a
# release without passing these checks, and the run history is the evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Clean-room check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/check_provenance.py
      - run: python -m unittest tests.test_provenance -v

  emergence-kit:
    name: Emergence Kit (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/emergence-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v

  brain:
    name: Knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          python -m pip install numpy pyyaml pypdf requests fastapi httpx
          pydantic "uvicorn[standard]" "mcp>=1.2"
      - run: python tests/test_pipeline.py
      - run: python tests/test_manuals.py
