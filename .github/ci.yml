# Continuous integration: every push and pull request is tested the same way.
# ITIL: change enablement and release management start here - no change reaches a
# release without passing these checks, and the run history is the evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: Clean-room check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/check_provenance.py
      - run: python -m unittest tests.test_provenance -v

  emergence-kit:
    name: Emergence Kit (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/emergence-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v

  brain:
    name: Knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          python -m pip install numpy pyyaml pypdf requests fastapi httpx
          pydantic "uvicorn[standard]" "mcp>=1.2" "pyjwt[crypto]>=2.10"
      - run: python tests/test_pipeline.py
      - run: python tests/test_manuals.py
      - run: python tests/test_identity.py
      - run: python tests/test_secrets.py

  hub:
    name: Survey hub (SQLite + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: hubtest
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hub" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      HUB_TEST_PG_URL: postgresql://hub@localhost:5432/hubtest
      PGPASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg and PostgreSQL 16 client (pg_dump / pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: >
          python -m pip install numpy pyyaml requests fastapi httpx "uvicorn[standard]"
          "pyjwt[crypto]>=2.10" "psycopg[binary]>=3.1"
      - run: python tests/test_hub.py -v
